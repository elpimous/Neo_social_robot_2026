# ╔══════════════════════════════════════════════════════════════════╗
# ║           NAV2 PARAMS — Néo / qbo — Jetson Orin NX 16Go        ║
# ║           Controller : MPPI (GPU CUDA)                          ║
# ╚══════════════════════════════════════════════════════════════════╝


# ───────────────── AMCL ─────────────────

amcl:
  ros__parameters:
    use_sim_time: false
    scan_topic: /scan

    odom_frame_id: odom
    base_frame_id: base_footprint
    global_frame_id: map

    max_particles: 500
    min_particles: 100

    laser_model_type: likelihood_field
    max_beams: 60

    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    pf_err: 0.05
    pf_z: 0.99

    update_min_d: 0.01
    update_min_a: 0.01
    resample_interval: 1

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.1

    z_hit: 0.5
    z_rand: 0.5
    sigma_hit: 0.2
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.15

    tf_broadcast: true
    transform_tolerance: 1.0

    set_initial_pose: true
    first_map_only: false

    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    recovery_alpha_slow: 0.01
    recovery_alpha_fast: 0.1


# ───────────────── MAP ─────────────────

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/home/nvidia/qbo_ws/src/qbo_navigation/map/map.yaml"


# ───────────────── PLANNER ─────────────────

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0 # 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.3
      use_astar: true
      allow_unknown: true


# ───────────────── CONTROLLER — MPPI (GPU) ─────────────────

controller_server:
  ros__parameters:
    controller_frequency: 10.0 # → aligner sur la fréquence réelle AMCL/lidar
    transform_tolerance: 1.0
    min_x_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.001

    progress_checker_plugin: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 15.0

    goal_checker_plugin: "goal_checker"
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.15
      stateful: true

    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 30 # 56 Le robot simule le futur à chaque cycle
      model_dt: 0.05
      batch_size: 800 # 2000
      iteration_count: 2  # 2 passes MPPI → convergence plus stable sans doubler le coût GPU
      vx_std: 0.15 # Moins de bruit sur la vitesse linéaire → pas de micro-ralentissements aléatoires
      wz_std: 0.3
      vy_std: 0.0
      vx_max: 0.4
      vx_min: -0.1
      vy_max: 0.0
      wz_max: 0.6
      ax_max: 0.5
      ax_min: -0.5
      ay_max: 0
      az_max: 1.1
      temperature: 0.25 # Moins de variance entre trajectoires → le robot ne change plus d'avis à chaque cycle
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      critics:
        - "ConstraintCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "ObstaclesCritic"
        - "PreferForwardCritic"
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0 # Colle mieux au chemin → moins de dérive latérale qui force des corrections
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.0
        critical_weight: 15.0
        consider_footprint: false
        collision_cost: 10000.0
        collision_margin_distance: 0.15 # s'éloigner de l'obstacle
        near_goal_distance: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0 # Ne pénalise plus les trajectoires légèrement plus lentes


# ───────────────── BEHAVIOR SERVER ─────────────────

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0
    backup_speed: 0.15
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 1.0


# ───────────────── GLOBAL COSTMAP ─────────────────

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      transform_tolerance: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.20
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        enabled: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.40 # 0.20
        cost_scaling_factor: 1.75 # 5.0


# ───────────────── LOCAL COSTMAP ─────────────────

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      transform_tolerance: 1.0
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.20
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.40 # 0.25
        cost_scaling_factor: 1.75 # 3.0


# ───────────────── BT NAVIGATOR ─────────────────

bt_navigator:
  ros__parameters:
    transform_tolerance: 1.0
    use_sim_time: false
    action_server_result_timeout: 900.0
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /qbo_arduqbo/base_ctrl/odom
    default_bt_xml_filename: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_and_recovery.xml
    default_nav_through_poses_bt_xml_filename: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_and_recovery.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_goal_updater_node_bt_node


# ───────────────── LIFECYCLE ─────────────────

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 10.0
    node_names:
      - map_server
      - amcl

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 30.0
    node_names:
      - planner_server
      - controller_server
      - bt_navigator
      - behavior_server