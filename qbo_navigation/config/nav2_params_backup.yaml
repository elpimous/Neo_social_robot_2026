# ───────────────── AMCL ─────────────────

amcl:
  ros__parameters:
    use_sim_time: false

    scan_topic: /scan

    odom_frame_id: odom
    base_frame_id: base_footprint
    global_frame_id: map

    max_particles: 500
    min_particles: 100

    laser_model_type: likelihood_field
    max_beams: 60

    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    pf_err: 0.05
    pf_z: 0.99

    update_min_a: 0.05
    update_min_d: 0.05

    tf_broadcast: true
    transform_tolerance: 2.0

    set_initial_pose: true
    first_map_only: false

    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0


# ───────────────── MAP ─────────────────

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/home/nvidia/qbo_ws/src/qbo_navigation/map/map.yaml"


# ───────────────── PLANNER ─────────────────

planner_server:
  ros__parameters:

    expected_planner_frequency: 10.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: true
      allow_unknown: true


# ───────────────── BEHAVIOR SERVER ─────────────────

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    simulate_ahead_time: 2.0
    # FIX : vitesse de rotation réduite pour les behaviors de recovery
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.2


# ───────────────── CONTROLLER ─────────────────

controller_server:
  ros__parameters:
    cmd_vel_topic: /qbo_arduqbo/base_ctrl/cmd_vel
    controller_frequency: 20.0
    transform_tolerance: 2.0

    min_x_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01

    # FIX : progress checker assoupli — avec odom statique le robot
    # ne déplace pas de position mesurée → abort immédiat sans ce fix
    progress_checker_plugin: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05   # défaut : 0.5 → trop strict sans odom réel
      movement_time_allowance: 30.0    # défaut : 10.0

    goal_checker_plugin: "goal_checker"
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.2

    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      transform_tolerance: 2.0
      critics: ["GoalDist", "PathDist", "RotateToGoal", "PathAlign", "GoalAlign", "BaseObstacle"]

      GoalDist:
        scale: 10.0
      PathDist:
        scale: 12.0
      RotateToGoal:
        scale: 8.0
        slowing_factor: 4.0
        lookahead_time: 0.5
      PathAlign:
        scale: 12.0
        forward_point_distance: 0.1
      GoalAlign:
        scale: 10.0
        forward_point_distance: 0.1
      BaseObstacle:
        scale: 0.5

      max_vel_x: 0.3
      min_vel_x: -0.2

      # FIX : min_vel_theta négatif → active la rotation droite
      # Sans cette valeur DWB n'échantillonne que les rotations gauche
      max_vel_theta: 0.6        # réduit depuis 1.0 → moins brusque
      min_vel_theta: -0.6       # AJOUT CRITIQUE : rotation droite activée

      min_speed_xy: -0.2
      max_speed_xy: 0.3

      # FIX : accélérations réduites → démarrages plus doux
      acc_lim_x: 0.8            # réduit depuis 1.0
      acc_lim_theta: 1.2        # réduit depuis 2.0

      vx_samples: 10
      vtheta_samples: 20

      sim_time: 1.5             # légèrement augmenté pour mieux anticiper

      linear_granularity: 0.05
      angular_granularity: 0.025


# ───────────────── GLOBAL COSTMAP ─────────────────

global_costmap:
  global_costmap:
    ros__parameters:
      transform_tolerance: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: nav2_costmap_2d::StaticLayer

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.2


# ───────────────── LOCAL COSTMAP ─────────────────

local_costmap:
  local_costmap:
    ros__parameters:
      transform_tolerance: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          observation_persistence: 0.0
          expected_update_rate: 0.0
          inf_is_valid: false

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.2


# ───────────────── BT NAVIGATOR ─────────────────

bt_navigator:
  ros__parameters:

    use_sim_time: false
    action_server_result_timeout: 900.0

    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /qbo_arduqbo/base_ctrl/odom

    default_bt_xml_filename: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_and_recovery.xml
    default_nav_through_poses_bt_xml_filename: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_and_recovery.xml

    plugin_lib_names:
      # Actions
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_truncate_path_action_bt_node
      # Conditions
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      # Decorators / Control
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_goal_updater_node_bt_node


# ───────────────── LIFECYCLE ─────────────────

lifecycle_manager_localization:
  ros__parameters:

    use_sim_time: false
    autostart: true

    node_names:
      - map_server
      - amcl


lifecycle_manager_navigation:
  ros__parameters:

    use_sim_time: false
    autostart: true
    bond_timeout: 20.0
    node_names:
      - planner_server
      - controller_server
      - bt_navigator
      - behavior_server