# =============================================================================
#  waypoints.yaml — 3 waypoints de la maison (repère "map")
#  Auteur : Vincent FOUCAULT — relevés le 29/10/2026 (record_waypoints)
#  yaw_deg : orienté vers le waypoint suivant (ignoré en mode fluide sans pause)
#  Ordre de passage : WP1 -> WP2 -> WP3 -> WP1 -> ...
# =============================================================================
frame_id: map

# Pose de départ envoyée à AMCL au lancement.
# enabled: false => le nœud attend un "2D Pose Estimate" dans RViz.
initial_pose:
  enabled: false
  x: 0.0
  y: 0.0
  yaw_deg: 0.0

waypoints:
  - {name: "WP1", x: 4.32, y: 1.78, yaw_deg: -117.4}
  - {name: "WP2", x: 2.55, y: -1.63, yaw_deg: 155.0}
  - {name: "WP3", x: -0.37, y: -0.27, yaw_deg: 23.6}
