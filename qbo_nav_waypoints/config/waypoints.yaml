frame_id: map

# Pose de départ envoyée à AMCL au lancement.
# enabled: false => le nœud attend un "2D Pose Estimate" dans RViz.
initial_pose:
  enabled: false
  x: 0.0
  y: 0.0
  yaw_deg: 0.0

waypoints:
  - {name: "WP1", x: 4.53, y: 0.78, yaw_deg: -129.6}
  - {name: "WP2", x: 2.47, y: -1.71, yaw_deg: 154.9}
  - {name: "WP3", x: -0.43, y: -0.35, yaw_deg: 12.8}
