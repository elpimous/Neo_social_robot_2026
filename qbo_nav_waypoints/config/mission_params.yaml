# =============================================================================
#  mission_params.yaml — nœud waypoint_mission (test d'endurance Néo)
#  Auteur : Vincent FOUCAULT
#  Les valeurs marquées ">>> À VÉRIFIER" dépendent de ta config Néo.
# =============================================================================
waypoint_mission:
  ros__parameters:
    # ---------------- Mission ----------------
    waypoints_file: ""                 # réécrit par le launch (arg waypoints:=)
    duration_min: 120.0                # durée du test (2 h). Le trajet en cours se termine.
    max_laps: 0                        # 0 = illimité (seule la durée compte)
    pause_min_s: 0.0                   # 0/0 = AUCUNE pause : passage fluide d'un waypoint au suivant
    pause_max_s: 0.0                   # (ex. 5/30 pour des pauses aléatoires, robot arrêté, lidar coupé)
    pass_radius_m: 0.40                # sans pause : waypoint franchi à 40 cm, on enchaîne sans s'arrêter
    random_seed: -1                    # -1 = aléatoire, sinon reproductible
    start_from_nearest: true           # commence par le waypoint le plus proche
    leg_timeout_s: 240.0               # temps max pour un trajet WP -> WP
    max_attempts_per_leg: 3            # tentatives avant de sauter au WP suivant
    retry_wait_s: 3.0
    max_consecutive_failed_legs: 3     # au-delà : arrêt sécurisé de la mission
    log_dir: "~/.ros/qbo_nav_test"     # CSV détaillé + résumé

    # ---------------- Topics ----------------
    cmd_vel_topic: "/qbo_arduqbo/base_ctrl/cmd_vel"   # réécrit par le launch
    odom_topic: "/qbo_arduqbo/base_ctrl/odom"         # réécrit par le launch
    amcl_pose_topic: "/amcl_pose"
    initial_pose_timeout_s: 600.0      # si pas de initial_pose dans le YAML : attente "2D Pose Estimate"

    # ---------------- Localisation (sécurité) ----------------
    loc:
      check_enabled: true
      max_xy_std_m: 0.80               # σ AMCL (axe le plus incertain) au-delà => robot perdu => arrêt
      max_yaw_std_rad: 0.80

    # ---------------- Tête pan/tilt verrouillée ----------------
    head:
      enabled: true
      command_type: "joint_state"      # "joint_state" (sensor_msgs/JointState) ou "float64_array"
      command_topic: "/cmd_joints"     # nœud qbo_dynamixel (qbo_arduqbo)
      joint_states_topic: "/joint_states"
      joint_names: ["head_pan_joint", "head_tilt_joint"]
      lock_positions_rad: [0.0, 0.0]   # pan 0 = face ; le tilt est REMPLACÉ par l'arg tilt_level_rad du launch
      tilt_joint: "head_tilt_joint"
      speed_rad_s: 0.6                 # vitesse de ralliement (envoyée au verrouillage seulement)
      reach_tolerance_rad: 0.02        # ~1.1° : tête considérée en place
      drift_tolerance_rad: 0.035       # 2° : lidar à ~0.5 m du sol, au-delà le plan laser part vers le sol/plafond
      republish_hz: 0.2                # consigne renvoyée toutes les 5 s : empêche l'auto torque OFF (20 s) de qbo_dynamixel
      lock_timeout_s: 10.0
      settle_time_s: 1.0
      require_feedback: true           # false si /joint_states ne publie pas la tête

    # ---------------- Contrôle d'horizontalité du laser (via TF) ----------------
    level:
      enabled: true
      base_frame: "base_footprint"     # réécrit par le launch
      laser_frame: "laser"             # frame_id du scan (TF dynamique head_laser_tf)
      tolerance_deg: 1.5               # lidar à ~0.5 m : 1.5° => sol touché à ~19 m (hors portée 12 m)

    # ---------------- RPLidar A2 : marche pendant les trajets, arrêt en pause ----------------
    lidar:
      control_enabled: true
      stop_during_pause: true          # sans effet quand il n'y a pas de pause (lidar toujours actif)
      start_service: "/start_motor"    # std_srvs/Empty (driver rplidar_ros)
      stop_service: "/stop_motor"
      scan_topic: "/scan"
      spinup_s: 2.0                    # montée en vitesse du moteur
      fresh_scans_required: 5          # scans valides exigés avant de rouler
      start_timeout_s: 10.0
      start_attempts: 3
      max_scan_age_s: 0.6              # en mouvement : scan plus vieux => arrêt immédiat
