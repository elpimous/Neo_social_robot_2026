# ═══════════════════════════════════════════════════════════════════════════════
#  qbo_stt — params.yaml
#  Paramètres du node Speech-To-Text pour robot Néo
#  FastConformer CTC CUDA + Silero VAD (hystérésis)
#  Author : Vincent Foucault — Avril 2026 — MIT
# ═══════════════════════════════════════════════════════════════════════════════
#
# Usage direct (sans launch file) :
#   ros2 run qbo_stt stt_node --ros-args --params-file \
#       ~/qbo_ws/src/qbo_stt/config/params.yaml
#
# Usage via launch (recommandé) :
#   ros2 launch qbo_stt stt_node.launch.py
#
# Pour override ponctuel d'un paramètre depuis la CLI :
#   ros2 launch qbo_stt stt_node.launch.py vad_debug:=true
# ═══════════════════════════════════════════════════════════════════════════════

stt_node:
  ros__parameters:

    # ── Chemins des modèles ──────────────────────────────────────────────────
    fc_model:   "/home/nvidia/qbo_ws/src/qbo_stt/models/model.onnx"
    fc_tokens:  "/home/nvidia/qbo_ws/src/qbo_stt/models/tokens.txt"
    vad_model:  "/home/nvidia/qbo_ws/src/qbo_stt/models/silero_vad.onnx"

    # ── VAD Silero — hystérésis ──────────────────────────────────────────────
    # Seuil haut pour DÉMARRER (IDLE → PRE_SPEECH) ;
    # seuil bas (≤ start) pour CONTINUER (SPEECH/MAYBE_END).
    vad_threshold_start:     0.50
    vad_threshold_end:       0.50

    # Nombre de chunks consécutifs (is_sp=True AND rms suffisant) pour
    # confirmer une reprise MAYBE_END → SPEECH. 3 chunks ≈ 96ms @ 512 samples.
    # Filtre les spikes isolés (claquements, bruits transitoires).
    vad_resume_consecutive:  3

    # ── VAD Silero — timings ─────────────────────────────────────────────────
    # Durée de silence (en ms) pour déclarer une fin de phrase depuis MAYBE_END.
    vad_min_silence_ms:      600

    # Durée mini de parole détectée (en ms) pour valider PRE_SPEECH → SPEECH.
    # 200ms = 6 chunks @ 512 samples. Si tu veux capter des "oui"/"non" très
    # courts (<250ms), descends à 100ms.
    vad_min_speech_ms:       200

    # Durée max d'un segment de parole (en s) avant flush forcé.
    vad_max_speech_s:        10.0

    # Durée de pré-buffer (en ms) conservé avant la détection, pour capter
    # l'attaque du premier mot.
    vad_pre_buffer_ms:       800

    # ── Audio capture ────────────────────────────────────────────────────────
    # Device PyAudio (sur Néo : ReSpeaker Lite = device 0).
    # Pour lister : python3 -c "import pyaudio; p=pyaudio.PyAudio(); \
    #   [print(i, p.get_device_info_by_index(i)['name']) for i in range(p.get_device_count())]"
    audio_device_index:      0

    # Taille du chunk audio (samples). 512 @ 16kHz = 32ms de latence.
    # Ne pas descendre sous 512 (Silero VAD requiert 512 pour 16kHz).
    chunk_size:              512

    # ── Inférence ASR ────────────────────────────────────────────────────────
    # Seuil de warning sur RTF (Real-Time Factor). En pratique sur Orin NX :
    # FastConformer CTC CUDA tourne à RTF 0.025-0.045. 0.20 = alerte si >5x
    # plus lent que temps réel (symptôme de saturation GPU).
    rtf_warn_threshold:      0.20

    # Durée mini du wav envoyé à FastConformer (en s). En dessous, rejet
    # préventif (segment trop court pour transcription fiable).
    min_wav_duration_s:      0.30

    # Nombre minimal de mots pour publier la transcription.
    min_words_to_publish:    1

    # ── Debug ────────────────────────────────────────────────────────────────
    # Si true, logs détaillés en état MAYBE_END (progression silence_ms,
    # candidats reprise, transitions). À désactiver en production.
    vad_debug:               false